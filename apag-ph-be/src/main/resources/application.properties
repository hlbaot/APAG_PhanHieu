spring.application.name=apag-ph-be
server.port=8080

# Database Configuration (Default MySQL with H2 fallback/in-memory for development)
# For MySQL:
spring.datasource.url=jdbc:mysql://localhost:3306/apag_ph?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 1 day in milliseconds (86400000)
app.jwt.expiration-ms=86400000

